<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>計算ゲーム</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', 'Hiragino Sans', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .screen { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 480px; }
    .screen.active { display: flex; }

    /* ---------- SELECT ---------- */
    .select-title { font-size: 2rem; font-weight: 700; color: #7dd3fc; margin-bottom: 6px; }
    .select-sub   { color: #94a3b8; font-size: 0.9rem; margin-bottom: 36px; }

    .op-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 100%; }

    .op-btn {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 16px;
      padding: 26px 16px;
      cursor: pointer;
      color: inherit;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .op-btn:hover { border-color: #7dd3fc; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(125,211,252,0.12); }
    .op-icon    { font-size: 2.2rem; }
    .op-name    { font-size: 1.05rem; font-weight: 600; }
    .op-example { font-size: 0.78rem; color: #64748b; }

    /* ---------- GAME ---------- */
    .game-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .game-op-name { font-size: 0.85rem; color: #94a3b8; }
    .level-badge  { background: #0c2a4a; color: #7dd3fc; padding: 4px 12px; border-radius: 20px; font-size: 0.82rem; font-weight: 700; }
    .lives        { font-size: 1.1rem; letter-spacing: 1px; }

    .timer-wrap { width: 100%; height: 8px; background: #1e293b; border-radius: 4px; overflow: hidden; margin-bottom: 6px; }
    .timer-bar  { height: 100%; width: 100%; border-radius: 4px; background: #22c55e; transition: background 0.4s; }
    .timer-bar.warn   { background: #f59e0b; }
    .timer-bar.danger { background: #ef4444; }
    .timer-text { width: 100%; text-align: right; font-size: 0.78rem; color: #475569; margin-bottom: 20px; }

    .question-card {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 20px;
      padding: 36px 28px;
      width: 100%;
      text-align: center;
      margin-bottom: 20px;
      min-height: 130px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: border-color 0.2s;
    }
    .question-card.correct { border-color: #22c55e; animation: flash-green 0.4s; }
    .question-card.wrong   { border-color: #ef4444; animation: flash-red   0.4s; }

    @keyframes flash-green {
      0%  { background: #1e293b; }
      40% { background: #052e16; }
      100%{ background: #1e293b; }
    }
    @keyframes flash-red {
      0%  { background: #1e293b; }
      40% { background: #3b0a0a; }
      100%{ background: #1e293b; }
    }

    .question-text { font-size: 2.2rem; font-weight: 700; letter-spacing: 2px; line-height: 1.2; }
    .question-sub  { font-size: 0.85rem; color: #64748b; min-height: 1.2em; }

    .answer-wrap { width: 100%; display: flex; gap: 10px; margin-bottom: 14px; }

    .answer-input {
      flex: 1;
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 1.3rem;
      color: #f1f5f9;
      outline: none;
      text-align: center;
      transition: border-color 0.15s;
      -moz-appearance: textfield;
    }
    .answer-input::-webkit-outer-spin-button,
    .answer-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .answer-input:focus { border-color: #7dd3fc; }
    .answer-input:disabled { opacity: 0.4; }

    .submit-btn {
      background: #0284c7;
      border: none;
      border-radius: 12px;
      padding: 13px 22px;
      font-size: 0.95rem;
      font-weight: 700;
      color: white;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .submit-btn:hover   { background: #0369a1; }
    .submit-btn:active  { transform: scale(0.96); }
    .submit-btn:disabled { opacity: 0.4; cursor: default; }

    .bottom-row { width: 100%; display: flex; justify-content: space-between; font-size: 0.82rem; color: #64748b; margin-bottom: 10px; }
    .score-val  { color: #fbbf24; font-weight: 700; }

    .level-prog-wrap  { width: 100%; }
    .level-prog-label { display: flex; justify-content: space-between; font-size: 0.72rem; color: #475569; margin-bottom: 4px; }
    .level-prog-bg    { width: 100%; height: 5px; background: #1e293b; border-radius: 3px; overflow: hidden; }
    .level-prog-bar   { height: 100%; background: #38bdf8; border-radius: 3px; transition: width 0.35s ease; }

    /* ---------- RESULT ---------- */
    .result-icon  { font-size: 3.5rem; margin-bottom: 10px; }
    .result-title { font-size: 1.7rem; font-weight: 700; margin-bottom: 6px; }
    .result-score { font-size: 3rem; font-weight: 800; color: #fbbf24; margin-bottom: 28px; }

    .result-stats {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 18px 22px;
      width: 100%;
      margin-bottom: 24px;
    }
    .stat-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 0.88rem; border-bottom: 1px solid #0f172a; }
    .stat-row:last-child { border-bottom: none; }
    .stat-val { font-weight: 600; color: #7dd3fc; }

    .result-btns { width: 100%; display: flex; flex-direction: column; gap: 10px; }
    .btn-primary {
      background: #0284c7; border: none; border-radius: 12px;
      padding: 13px; font-size: 0.95rem; font-weight: 700;
      color: white; cursor: pointer; transition: background 0.15s;
    }
    .btn-primary:hover { background: #0369a1; }
    .btn-secondary {
      background: transparent; border: 2px solid #334155;
      border-radius: 12px; padding: 11px; font-size: 0.9rem;
      color: #94a3b8; cursor: pointer; transition: all 0.15s;
    }
    .btn-secondary:hover { border-color: #7dd3fc; color: #7dd3fc; }

    .back-link {
      position: fixed; top: 14px; left: 16px;
      color: #475569; text-decoration: none; font-size: 0.82rem;
      transition: color 0.15s;
    }
    .back-link:hover { color: #94a3b8; }
  </style>
</head>
<body>

<a class="back-link" href="../index.html">← 一覧へ</a>

<!-- ===== SELECT ===== -->
<div class="screen active" id="screen-select">
  <div class="select-title">🧮 計算ゲーム</div>
  <p class="select-sub">練習する計算を選んでください</p>
  <div class="op-grid">
    <button class="op-btn" onclick="startGame('+')">
      <span class="op-icon">➕</span>
      <span class="op-name">足し算</span>
      <span class="op-example">3 + 5 = ？</span>
    </button>
    <button class="op-btn" onclick="startGame('-')">
      <span class="op-icon">➖</span>
      <span class="op-name">引き算</span>
      <span class="op-example">9 − 4 = ？</span>
    </button>
    <button class="op-btn" onclick="startGame('×')">
      <span class="op-icon">✖️</span>
      <span class="op-name">掛け算</span>
      <span class="op-example">6 × 7 = ？</span>
    </button>
    <button class="op-btn" onclick="startGame('÷')">
      <span class="op-icon">➗</span>
      <span class="op-name">割り算</span>
      <span class="op-example">8 ÷ 2 = ？</span>
    </button>
  </div>
</div>

<!-- ===== GAME ===== -->
<div class="screen" id="screen-game">
  <div class="game-header">
    <span class="game-op-name" id="game-op-name"></span>
    <span class="level-badge" id="level-badge">Lv.1（1桁）</span>
    <span class="lives" id="lives-display">❤️❤️❤️</span>
  </div>

  <div class="timer-wrap"><div class="timer-bar" id="timer-bar"></div></div>
  <div class="timer-text" id="timer-text">10.0 秒</div>

  <div class="question-card" id="question-card">
    <div class="question-text" id="question-text"></div>
    <div class="question-sub"  id="question-sub"></div>
  </div>

  <div class="answer-wrap">
    <input class="answer-input" id="answer-input"
      type="number" inputmode="numeric" placeholder="？" autocomplete="off" />
    <button class="submit-btn" id="submit-btn" onclick="submitAnswer()">決定</button>
  </div>

  <div class="bottom-row">
    <span>スコア: <span class="score-val" id="score-display">0</span> pt</span>
    <span>正解: <span class="score-val" id="correct-display">0</span> 問</span>
  </div>

  <div class="level-prog-wrap">
    <div class="level-prog-label">
      <span>次のレベルまで</span>
      <span id="level-prog-count">0 / 5</span>
    </div>
    <div class="level-prog-bg">
      <div class="level-prog-bar" id="level-prog-bar" style="width:0%"></div>
    </div>
  </div>
</div>

<!-- ===== RESULT ===== -->
<div class="screen" id="screen-result">
  <div class="result-icon">🏁</div>
  <div class="result-title">ゲームオーバー</div>
  <div class="result-score" id="final-score">0 pt</div>

  <div class="result-stats">
    <div class="stat-row"><span>計算の種類</span><span class="stat-val" id="stat-op">-</span></div>
    <div class="stat-row"><span>最高レベル</span><span class="stat-val" id="stat-max-level">-</span></div>
    <div class="stat-row"><span>正解 / 問題数</span><span class="stat-val" id="stat-correct">-</span></div>
    <div class="stat-row"><span>正解率</span><span class="stat-val" id="stat-rate">-</span></div>
  </div>

  <div class="result-btns">
    <button class="btn-primary"   id="retry-btn"  onclick="retryGame()">もう一度（同じ計算）</button>
    <button class="btn-secondary"                 onclick="goToSelect()">計算の種類を変える</button>
  </div>
</div>

<script>
  /* ── CONFIG ── */
  const CORRECT_TO_ADVANCE = 5;
  const BASE_TIME          = 10;  // 秒 (Lv.1)
  const TIME_PER_LEVEL     = 3;   // 桁が増えるごとに +3 秒
  const INITIAL_LIVES      = 3;
  const OP_NAMES = { '+': '足し算', '-': '引き算', '×': '掛け算', '÷': '割り算' };

  /* ── STATE ── */
  let state = {};
  let timerInterval = null;

  /* ── UTIL ── */
  const randInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

  function getRange(level) {
    return {
      min: level === 1 ? 1 : Math.pow(10, level - 1),
      max: Math.pow(10, level) - 1,
    };
  }

  const getTimeLimit = (level) => BASE_TIME + (level - 1) * TIME_PER_LEVEL;

  function generateQuestion(op, level) {
    const { min, max } = getRange(level);
    let a, b, answer, display;

    if (op === '+') {
      a = randInt(min, max); b = randInt(min, max);
      answer = a + b;
      display = `${a} + ${b}`;

    } else if (op === '-') {
      do {
        a = randInt(min, max); b = randInt(min, max);
        if (a < b) { let t = a; a = b; b = t; }
      } while (a === b);
      answer = a - b;
      display = `${a} − ${b}`;

    } else if (op === '×') {
      a = randInt(min, max); b = randInt(1, 9);
      answer = a * b;
      display = `${a} × ${b}`;

    } else {
      answer = randInt(min, max); b = randInt(1, 9);
      a = answer * b;
      display = `${a} ÷ ${b}`;
    }

    return { display, answer };
  }

  /* ── SCREENS ── */
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  /* ── GAME FLOW ── */
  function startGame(op) {
    clearInterval(timerInterval);
    state = {
      op, level: 1, correctInLevel: 0,
      lives: INITIAL_LIVES, score: 0,
      totalQuestions: 0, totalCorrect: 0, maxLevel: 1,
      timeLeft: BASE_TIME, timeLimitForQuestion: BASE_TIME,
      question: null, answering: false,
    };
    document.getElementById('game-op-name').textContent = OP_NAMES[op];
    showScreen('screen-game');
    nextQuestion();
  }

  function nextQuestion() {
    state.answering = true;
    state.timeLimitForQuestion = getTimeLimit(state.level);
    state.timeLeft  = state.timeLimitForQuestion;
    state.question  = generateQuestion(state.op, state.level);
    state.totalQuestions++;

    document.getElementById('question-card').className = 'question-card';
    document.getElementById('question-text').textContent = state.question.display + ' = ？';
    document.getElementById('question-sub').textContent  = '';
    const inp = document.getElementById('answer-input');
    inp.value = ''; inp.disabled = false;
    document.getElementById('submit-btn').disabled = false;
    inp.focus();

    updateHUD();
    startTimer();
  }

  function startTimer() {
    clearInterval(timerInterval);
    const t0 = Date.now();
    const totalMs = state.timeLimitForQuestion * 1000;

    timerInterval = setInterval(() => {
      const rem = Math.max(0, totalMs - (Date.now() - t0));
      state.timeLeft = rem / 1000;
      renderTimer();
      if (rem <= 0) {
        clearInterval(timerInterval);
        if (state.answering) timeUp();
      }
    }, 50);
  }

  function renderTimer() {
    const pct = (state.timeLeft / state.timeLimitForQuestion) * 100;
    const bar = document.getElementById('timer-bar');
    bar.style.width = pct + '%';
    bar.className   = pct > 50 ? 'timer-bar' : pct > 25 ? 'timer-bar warn' : 'timer-bar danger';
    document.getElementById('timer-text').textContent = state.timeLeft.toFixed(1) + ' 秒';
  }

  /* ── ANSWER ── */
  function submitAnswer() {
    if (!state.answering) return;
    const raw = document.getElementById('answer-input').value.trim();
    if (!raw) return;
    const val = parseInt(raw, 10);
    if (isNaN(val)) return;

    clearInterval(timerInterval);
    state.answering = false;
    document.getElementById('answer-input').disabled = true;
    document.getElementById('submit-btn').disabled   = true;

    val === state.question.answer ? handleCorrect() : handleWrong();
  }

  function timeUp() {
    state.answering = false;
    document.getElementById('answer-input').disabled = true;
    document.getElementById('submit-btn').disabled   = true;
    setCardClass('wrong');
    document.getElementById('question-sub').textContent =
      `⏱ 時間切れ！  答え: ${state.question.answer}`;
    loseLife();
  }

  function handleCorrect() {
    const timeBonus  = Math.round(state.timeLeft);
    const basePoints = state.level * 10;
    const points     = basePoints + timeBonus;
    state.score        += points;
    state.totalCorrect++;
    state.correctInLevel++;

    setCardClass('correct');
    document.getElementById('question-sub').textContent =
      `+${points} pt（ベース ${basePoints} + 時間ボーナス ${timeBonus}）`;

    const leveledUp = state.correctInLevel >= CORRECT_TO_ADVANCE;
    if (leveledUp) {
      state.level++;
      state.correctInLevel = 0;
      if (state.level > state.maxLevel) state.maxLevel = state.level;
      updateHUD();
      setTimeout(() => {
        setCardClass('correct');
        document.getElementById('question-text').textContent = '🎉 レベルアップ！';
        document.getElementById('question-sub').textContent  = `${state.level} 桁の問題に挑戦！`;
      }, 500);
      setTimeout(nextQuestion, 1500);
    } else {
      updateHUD();
      setTimeout(nextQuestion, 900);
    }
  }

  function handleWrong() {
    setCardClass('wrong');
    document.getElementById('question-sub').textContent =
      `✕ 不正解　答え: ${state.question.answer}`;
    loseLife();
  }

  function loseLife() {
    state.lives--;
    updateHUD();
    if (state.lives <= 0) setTimeout(showResult, 1100);
    else                   setTimeout(nextQuestion, 1100);
  }

  function setCardClass(cls) {
    document.getElementById('question-card').className = 'question-card ' + cls;
  }

  /* ── HUD ── */
  function updateHUD() {
    const alive = Math.max(0, state.lives);
    document.getElementById('lives-display').textContent =
      '❤️'.repeat(alive) + '🖤'.repeat(INITIAL_LIVES - alive);
    document.getElementById('level-badge').textContent =
      `Lv.${state.level}（${state.level}桁）`;
    document.getElementById('score-display').textContent   = state.score.toLocaleString();
    document.getElementById('correct-display').textContent = state.totalCorrect;

    const pct = (state.correctInLevel / CORRECT_TO_ADVANCE) * 100;
    document.getElementById('level-prog-bar').style.width = pct + '%';
    document.getElementById('level-prog-count').textContent =
      `${state.correctInLevel} / ${CORRECT_TO_ADVANCE}`;
  }

  /* ── RESULT ── */
  function showResult() {
    clearInterval(timerInterval);
    const rate = state.totalQuestions > 0
      ? Math.round((state.totalCorrect / state.totalQuestions) * 100) : 0;

    document.getElementById('final-score').textContent    = state.score.toLocaleString() + ' pt';
    document.getElementById('stat-op').textContent        = OP_NAMES[state.op];
    document.getElementById('stat-max-level').textContent = `${state.maxLevel} 桁`;
    document.getElementById('stat-correct').textContent   = `${state.totalCorrect} / ${state.totalQuestions} 問`;
    document.getElementById('stat-rate').textContent      = `${rate}%`;
    document.getElementById('retry-btn').textContent      = `もう一度（${OP_NAMES[state.op]}）`;
    showScreen('screen-result');
  }

  function retryGame()  { startGame(state.op); }
  function goToSelect() { clearInterval(timerInterval); showScreen('screen-select'); }

  /* ── ENTER KEY ── */
  document.getElementById('answer-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') submitAnswer();
  });
</script>
</body>
</html>
